name: Release
# Push a tag like v2.1.0 → both apps are built and attached to a draft GitHub release, for you to review and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (ad hoc signature; see the release notes about Gatekeeper)
        run: ./macos/build.sh
      - name: Clean-up cases
        run: '"macos/build/Pip Dictée.app/Contents/MacOS/PipDictee" --test-cleanup shared/cleanup-cases.json'
      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent "Pip Dictée.app" "../../PipDictee-macOS.zip"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: PipDictee-macOS.zip }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path target/release/PipDictee.exe -DestinationPath ../PipDictee-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: PipDictee-Windows.zip }

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Checksums
        run: sha256sum PipDictee-*.zip > SHA256SUMS.txt
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" PipDictee-*.zip SHA256SUMS.txt --repo "${{ github.repository }}" --draft --generate-notes --title "Pip Dictée ${{ github.ref_name }}"
