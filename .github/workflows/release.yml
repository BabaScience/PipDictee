name: Release
# Push a tag like v2.1.0 → both apps are built and attached to a draft GitHub release, for you to review and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build (ad hoc signature; see the release notes about Gatekeeper)
        run: ./macos/build.sh
      - name: Clean-up cases
        run: '"macos/build/Pip Dictée.app/Contents/MacOS/PipDictee" --test-cleanup shared/cleanup-cases.json'
      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent "Pip Dictée.app" "../../PipDictee-macOS.zip"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: PipDictee-macOS.zip }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" installer\PipDictee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip (the app alone, for people who prefer no installer)
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/PipDictee.exe -DestinationPath ../PipDictee-Windows.zip
          Copy-Item target/installer/PipDictee-Setup-*.exe ..
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            PipDictee-Windows.zip
            PipDictee-Setup-*.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - name: Checksums
        run: sha256sum PipDictee-*.zip PipDictee-Setup-*.exe > SHA256SUMS.txt
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" PipDictee-Setup-*.exe PipDictee-*.zip SHA256SUMS.txt --repo "${{ github.repository }}" --draft --generate-notes --title "Pip Dictée ${{ github.ref_name }}"
