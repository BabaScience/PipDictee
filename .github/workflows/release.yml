name: Release
# Push a tag like v2.3.0 on main → both apps are built, tested and published as a GitHub release, with the notes
# from CHANGELOG.md. The apps check that release once a day and tell their users a new version is out.
#
# Safety: the tag must be on main and match the version inside both apps; the files get SHA-256 sums and a signed
# build provenance (`gh attestation verify <file> --repo BabaScience/PipDictee` proves GitHub Actions built it from
# this repo). Only the last job can write to the repo, and only to create the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: The tag is on main and matches both apps' version
        id: v
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG isn't vX.Y.Z (or vX.Y.Z-beta.1)"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that isn't on main"; exit 1
          fi
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' windows/Cargo.toml | head -1)
          mac_version=$(python3 -c "import plistlib; print(plistlib.load(open('macos/Info.plist','rb'))['CFBundleShortVersionString'])")
          # Info.plist may say "2.3" for 2.3.0.
          if [[ "$cargo_version" != "$version" ]] || [[ "$mac_version" != "$version" && "$mac_version.0" != "$version" ]]; then
            echo "::error::$TAG, windows/Cargo.toml ($cargo_version) and macos/Info.plist ($mac_version) must agree"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build (ad hoc signature; see the release notes about Gatekeeper)
        run: ./macos/build.sh
      - name: Clean-up cases
        run: '"macos/build/Pip Dictée.app/Contents/MacOS/PipDictee" --test-cleanup shared/cleanup-cases.json'
      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent "Pip Dictée.app" "../../PipDictee-macOS.zip"
      - uses: actions/upload-artifact@v7
        with: { name: macos, path: PipDictee-macOS.zip }

  windows:
    needs: check
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" installer\PipDictee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip (the app alone, for people who prefer no installer)
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/PipDictee.exe -DestinationPath ../PipDictee-Windows.zip
          Copy-Item target/installer/PipDictee-Setup-*.exe ..
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            PipDictee-Windows.zip
            PipDictee-Setup-*.exe

  release:
    needs: [check, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the build provenance
      attestations: write   # store it
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: CHANGELOG.md, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true, path: dist }
      - name: Checksums
        run: cd dist && sha256sum PipDictee-*.zip PipDictee-Setup-*.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PipDictee-*.zip
            dist/PipDictee-Setup-*.exe
      - name: Release notes (this version's section of CHANGELOG.md)
        env: { VERSION: "${{ needs.check.outputs.version }}" }
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; fi
          {
            echo
            echo "---"
            echo "**Install**"
            echo "- **Windows:** \`PipDictee-Setup-*.exe\`. Windows may say \"Windows protected your PC\" because the app isn't signed with a paid certificate: click *More info → Run anyway*."
            echo "- **macOS:** unzip \`PipDictee-macOS.zip\`, move *Pip Dictée* to Applications, then right-click it → *Open* the first time (it isn't notarized)."
            echo "- **Check a download:** compare it with \`SHA256SUMS.txt\`, or run \`gh attestation verify <file> --repo BabaScience/PipDictee\`."
          } >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "Pip Dictée $TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" dist/PipDictee-Setup-*.exe dist/PipDictee-*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
