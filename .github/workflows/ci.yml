name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the code.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - name: No personal data files
        run: |
          if git ls-files | grep -Ei '(^|/)(history|historique|dictionary|dictionnaire|settings)\.json$|\.(log|bin|wav|sqlite|p12|pfx|key|pem)$|signing\.local$'; then
            echo "Personal data or secret files are tracked." >&2; exit 1
          fi

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every string translated in every language
        run: python3 scripts/i18n.py

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build (ad hoc signature)
        run: ./macos/build.sh
      - name: Clean-up cases
        run: '"macos/build/Pip Dictée.app/Contents/MacOS/PipDictee" --test-cleanup shared/cleanup-cases.json'
      - uses: actions/upload-artifact@v7
        with:
          name: PipDictee-macos
          path: macos/build/

  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - name: Tests (shared clean-up cases)
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" installer\PipDictee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: PipDictee-windows
          path: |
            windows/target/installer/PipDictee-Setup-*.exe
            windows/target/release/PipDictee.exe
