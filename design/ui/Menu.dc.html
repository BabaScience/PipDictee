<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu-bar panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B8361F}a:hover{color:#8F2C1B}
</style>
</helmet>
<div style="width: 1100px; height: 760px; position: relative; overflow: hidden; background: #F2EEE9; font-family: Nunito, -apple-system, system-ui, sans-serif; color: #17142A">
  <div style="position: absolute; left: -100px; top: 200px; width: 560px; height: 560px; border-radius: 50%; background: #FFB59C; filter: blur(110px); opacity: .7"></div>
  <div style="position: absolute; left: 560px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: #CBB8FF; filter: blur(110px); opacity: .65"></div>

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: rgba(255,255,255,0.45); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255,255,255,0.6); font-size: 13px; font-weight: 700; color: #2A2640">
    <span>Finder</span><span style="font-weight: 600">File</span><span style="font-weight: 600">Edit</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 14px">
      <span style="display: flex; align-items: center; gap: 2px; padding: 2px 6px; border-radius: 6px; background: rgba(23,20,42,0.12)">
        <svg viewBox="20 40 160 145" width="18" height="16" aria-hidden="true"><path d="M100 52 C150 52 172 84 172 118 C172 152 142 170 100 170 C58 170 28 152 28 118 C28 84 50 52 100 52 Z" fill="none" stroke="#2A2640" stroke-width="15"></path><ellipse cx="80" cy="112" rx="11" ry="15" fill="#2A2640"></ellipse><ellipse cx="120" cy="112" rx="11" ry="15" fill="#2A2640"></ellipse></svg>
        <svg viewBox="0 0 10 16" width="6" height="12" aria-hidden="true"><path d="M2 3 Q7 8 2 13" fill="none" stroke="#2A2640" stroke-width="2" stroke-linecap="round"></path></svg>
      </span>
      <span>Fri 13 Nov 10:31</span>
    </div>
  </div>

  <div style="position: absolute; left: 640px; top: 40px; width: 380px; box-sizing: border-box; padding: 16px; border-radius: 24px; background: rgba(255,255,255,0.72); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.9); box-shadow: inset 0 1px 0 #FFFFFF, 0 24px 60px rgba(60,40,110,0.2); display: flex; flex-direction: column; gap: 14px">

    <div style="display: flex; align-items: center; gap: 12px">
      <svg viewBox="20 40 160 145" width="44" height="40" role="img" aria-label="Pip, ready">
        <defs><linearGradient id="mn-pip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA184"></stop><stop offset="1" stop-color="#FF6A4D"></stop></linearGradient></defs>
        <path d="M100 52 C150 52 172 84 172 118 C172 152 142 170 100 170 C58 170 28 152 28 118 C28 84 50 52 100 52 Z" fill="url(#mn-pip)"></path>
        <ellipse cx="80" cy="112" rx="8" ry="12" fill="#17142A"></ellipse><ellipse cx="120" cy="112" rx="8" ry="12" fill="#17142A"></ellipse>
        <path d="M92 134 Q100 141 108 134" fill="none" stroke="#17142A" stroke-width="5" stroke-linecap="round"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: Fredoka, Nunito, sans-serif; font-size: 18px; font-weight: 600">Pip Dictée</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #3D3852"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2FBF8C"></span>Ready · Whisper runs on this Mac</span>
      </div>
    </div>

    <div style="padding: 14px; border-radius: 16px; background: rgba(245,242,252,0.9); display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
        Hold
        <span style="padding: 3px 8px; border-radius: 7px; background: #FFFFFF; border: 1px solid rgba(23,20,42,0.12); box-shadow: inset 0 -2px 0 rgba(23,20,42,0.1); font-weight: 800">⌃</span>
        <span style="padding: 3px 8px; border-radius: 7px; background: #FFFFFF; border: 1px solid rgba(23,20,42,0.12); box-shadow: inset 0 -2px 0 rgba(23,20,42,0.1); font-weight: 800">⌥</span>
        and talk
      </div>
      <span style="font-size: 13px; color: #3D3852">Add Space for hands-free · Esc cancels · ⌃⌘V types the last one again</span>
      <button type="button" style="padding: 11px; border-radius: 14px; border: 0; background: #FF6A4D; color: #17142A; font: 800 14px Nunito, -apple-system, sans-serif">Start hands-free</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center"><span style="font-size: 12.5px; font-weight: 800; color: #3D3852; letter-spacing: .4px">RECENT</span><a href="Settings.dc.html" style="margin-left: auto; font-size: 12.5px; font-weight: 700">All history</a></div>
      <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.75); text-align: left; font: inherit; color: inherit">
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1"><span style="font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Thanks for the notes on the intro. I agree the first…</span><span style="font-size: 12px; color: #4A4560">Mail · 2 min ago</span></span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-label="Copy"><rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="#3D3852" stroke-width="2"></rect><path d="M5 15 V6 a2 2 0 0 1 2-2 h8" fill="none" stroke="#3D3852" stroke-width="2"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 0; background: transparent; text-align: left; font: inherit; color: inherit">
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1"><span style="font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Can we move the call to 4 pm? I'm stuck in a review.</span><span style="font-size: 12px; color: #4A4560">Slack · 18 min ago</span></span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-label="Copy"><rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="#3D3852" stroke-width="2"></rect><path d="M5 15 V6 a2 2 0 0 1 2-2 h8" fill="none" stroke="#3D3852" stroke-width="2"></path></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 0; background: transparent; text-align: left; font: inherit; color: inherit">
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1"><span style="font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Add a retry when the whisper server isn't ready yet</span><span style="font-size: 12px; color: #4A4560">Xcode · 1 h ago</span></span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-label="Copy"><rect x="8" y="8" width="11" height="12" rx="2.5" fill="none" stroke="#3D3852" stroke-width="2"></rect><path d="M5 15 V6 a2 2 0 0 1 2-2 h8" fill="none" stroke="#3D3852" stroke-width="2"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px; border-top: 1px solid rgba(23,20,42,0.08)">
      <div style="display: flex; align-items: center; padding: 8px 4px; font-size: 14px; font-weight: 700">
        <label for="mn-lang">Language</label>
        <select id="mn-lang" style="margin-left: auto; padding: 5px 10px; border-radius: 10px; border: 1px solid rgba(23,20,42,0.14); background: #FFFFFF; font: 700 13px Nunito, sans-serif; color: #17142A"><option>Automatic</option><option>English</option><option>Français</option></select>
      </div>
      <div style="display: flex; align-items: center; padding: 8px 4px; font-size: 14px; font-weight: 700">
        <span>Paste automatically</span>
        <span style="margin-left: auto; width: 38px; height: 22px; border-radius: 11px; background: #FF6A4D; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF"></span></span>
      </div>
      <div style="display: flex; align-items: center; padding: 8px 4px; font-size: 14px; font-weight: 700">
        <span>Remove filler words</span>
        <span style="margin-left: auto; width: 38px; height: 22px; border-radius: 11px; background: #FF6A4D; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF"></span></span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid rgba(23,20,42,0.08)">
      <a href="Settings.dc.html" style="flex: 1; padding: 9px; border-radius: 12px; background: rgba(255,255,255,0.8); border: 1px solid rgba(23,20,42,0.1); color: #17142A; text-align: center; font-size: 13.5px; font-weight: 700; text-decoration: none">Dictionary…</a>
      <a href="Settings.dc.html" style="flex: 1; padding: 9px; border-radius: 12px; background: rgba(255,255,255,0.8); border: 1px solid rgba(23,20,42,0.1); color: #17142A; text-align: center; font-size: 13.5px; font-weight: 700; text-decoration: none">Settings…</a>
      <button type="button" style="padding: 9px 14px; border-radius: 12px; border: 1px solid rgba(23,20,42,0.1); background: transparent; color: #3D3852; font: 700 13.5px Nunito, sans-serif">Quit</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
