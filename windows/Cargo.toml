[package]
name = "pip-dictee"
version = "2.1.0"
edition = "2021"
description = "Free, 100 % local voice dictation — Windows edition"
license = "MIT"
publish = false

[[bin]]
name = "PipDictee"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "5"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
hound = "3.5"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
arboard = "3.4"
tray-icon = "0.26"
tao = "0.37"
wry = "0.57"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
png = "0.18"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
