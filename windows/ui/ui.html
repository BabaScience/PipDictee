<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Pip Dictée for Windows: every window's UI (pill, panel, settings, setup), shown in WebView2.
     Built into the .exe; nothing is loaded from the network. Text from the user (dictations, dictionary) is only
     ever set with textContent, never as HTML. Open it in a browser (ui.html#gallery&lang=fr) to see every screen
     with sample data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip Dictée</title>
<style>
:root {
  --coral: #FF6A4D; --coral-light: #FFA184; --coral-soft: #FF8A6E; --coral-text: #B8361F;
  --ink: #17142A; --ink-soft: #3D3852; --ink-muted: #4A4560; --mist: #F5F2FC;
  --mint: #3DD6A0; --mint-text: #1F7A57; --sun: #FFC845; --sun-text: #7A5400; --line: rgba(23,20,42,0.09);
  --title: "Fredoka", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --text: "Nunito", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--text); color: var(--ink); background: transparent; -webkit-user-select: none; user-select: none; overflow: hidden; }
body.page { background: #fff; }
body.gallery { background: #E9E4F2; overflow: auto; }
input, textarea, select, button { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--coral-text); outline-offset: 2px; }
h1, h2 { font-family: var(--title); font-weight: 600; margin: 0; }
.muted { color: var(--ink-muted); }
.soft { color: var(--ink-soft); }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Buttons and controls */
.btn { border: 0; border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: 13.5px; background: var(--coral); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn.secondary { background: #fff; border: 1px solid var(--line); }
.btn.quiet { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
.btn.amber { background: var(--sun); }
.btn.fill { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.link { border: 0; background: none; padding: 0; font-weight: 700; font-size: 13px; color: var(--coral-text); }
.switch { position: relative; width: 38px; height: 22px; border-radius: 11px; border: 0; background: #D6D1E0; flex-shrink: 0; padding: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.15); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--coral); }
.switch[aria-checked="true"]::after { left: 18px; }
select { border: 1px solid rgba(23,20,42,.14); border-radius: 10px; padding: 5px 8px; background: #fff; font-weight: 700; font-size: 13px; }
.key { display: inline-block; padding: 2px 8px; border-radius: 7px; background: #fff; border: 1px solid var(--line); box-shadow: 0 1.5px 0 rgba(23,20,42,.08); font-weight: 800; font-size: 13px; }
.check { color: var(--mint-text); font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.check::before { content: "✓"; font-weight: 900; }
.dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.label { font-size: 12.5px; font-weight: 800; letter-spacing: .4px; color: var(--ink-soft); text-transform: uppercase; }

/* Pill */
#pill-wrap { height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
.pill { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 18px 0 8px; border-radius: 29px; background: rgba(23,20,42,.92);
  border: 1px solid rgba(255,255,255,.18); box-shadow: 0 10px 28px rgba(23,20,42,.35); color: #fff; animation: pop .35s cubic-bezier(.2,.9,.3,1.2); }
.pill.small { height: 46px; padding-right: 16px; }
.pill.amber { border: 2px solid var(--sun); box-shadow: 0 0 0 5px rgba(255,200,69,.25), 0 10px 28px rgba(23,20,42,.35); padding-right: 8px; }
.pill .t { font-family: var(--title); font-weight: 600; font-size: 15px; white-space: nowrap; }
.pill .sub { font-weight: 700; font-size: 13px; color: rgba(255,255,255,.75); white-space: nowrap; }
.wave { display: flex; align-items: center; gap: 4px; height: 28px; }
.wave span { width: 4px; border-radius: 2px; background: var(--coral-soft); transition: height .08s; }
.dots { display: flex; gap: 5px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: #fff; animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,100% { opacity: .3; transform: none; } 50% { opacity: 1; transform: translateY(-3px); } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.lean { animation: lean 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes lean { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(-1deg) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Panel (opens from the tray) */
#panel { margin: 8px; height: calc(100% - 16px); border-radius: 16px; background: #FBFAFE; border: 1px solid rgba(23,20,42,.12);
  box-shadow: 0 12px 34px rgba(23,20,42,.22); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
.shortcut { background: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.recent-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
.recent-item:first-of-type, .recent-item:hover { background: #fff; }
.icon-btn { width: 30px; height: 30px; border-radius: 15px; border: 0; background: #fff; color: var(--ink-soft); font-size: 15px; display: grid; place-items: center; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }

/* Settings */
#settings { display: flex; height: 100%; }
#settings nav { width: 200px; flex-shrink: 0; background: var(--mist); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); }
#settings nav button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: 14px; text-align: left; }
#settings nav button[aria-current="page"] { background: #fff; font-weight: 800; box-shadow: 0 1px 3px rgba(23,20,42,.08); }
#settings nav button[aria-current="page"] .ico { color: var(--coral-text); }
#settings main { flex: 1; overflow-y: auto; padding: 32px 32px 28px; display: flex; flex-direction: column; gap: 22px; -webkit-user-select: text; user-select: text; }
.ico { width: 18px; text-align: center; color: var(--ink-soft); font-size: 15px; }
.srow { display: flex; align-items: center; gap: 16px; padding: 13px 16px; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow .title { font-weight: 800; font-size: 14.5px; }
.srow .detail { font-size: 13px; color: var(--ink-muted); margin-top: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px 6px 12px; border-radius: 999px; background: var(--mist); font-weight: 700; font-size: 13.5px; }
.chip button { border: 0; background: none; color: var(--ink-muted); font-size: 11px; font-weight: 900; padding: 0 2px; }
.chip.add { background: none; border: 1.5px dashed rgba(23,20,42,.25); padding: 0 6px 0 12px; }
.chip.add input { border: 0; outline: none; width: 130px; padding: 6px 0; background: transparent; font-weight: 700; font-size: 13.5px; }
.pairs .head, .pairs .item, .pairs .new { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 22px; gap: 10px; padding: 9px 14px; align-items: center; }
.pairs .head { background: #FAF8FD; font-size: 12.5px; font-weight: 800; color: var(--ink-muted); }
.pairs .item, .pairs .new { border-top: 1px solid var(--line); font-size: 14px; }
.pairs .item b { font-weight: 800; }
.pairs input { border: 0; outline: none; background: transparent; font-size: 14px; min-width: 0; }
.pairs .rm, .pairs .plus { border: 0; background: none; font-weight: 900; color: var(--ink-muted); font-size: 15px; }
.pairs .plus { color: var(--coral-text); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 13.5px; background: var(--mist); }
.seg button[aria-pressed="true"] { background: var(--coral); }
.privacy { background: var(--ink); color: #fff; border-radius: 20px; padding: 20px; display: flex; gap: 18px; align-items: center; }
.privacy ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 6px 18px; font-size: 13.5px; font-weight: 600; }
.privacy li::before { content: "✓ "; color: var(--mint); font-weight: 900; }
.hist-item { display: flex; gap: 12px; padding: 12px 16px; border: 0; border-top: 1px solid var(--line); background: #fff; text-align: left; width: 100%; }
.hist-item:first-child { border-top: 0; }

/* Setup */
#setup { height: 100%; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; text-align: center; background: #fff; }
#setup.amber { background: #FFF8E1; }
.steps { display: flex; gap: 6px; }
.steps span { height: 7px; width: 7px; border-radius: 4px; background: rgba(23,20,42,.12); }
.steps span.on { background: var(--coral); }
.steps span.cur { width: 18px; }
.hero { height: 170px; display: grid; place-items: center; position: relative; }
.hero .glow { position: absolute; width: 168px; height: 168px; border-radius: 50%; }
.body { font-size: 15.5px; line-height: 1.45; color: var(--ink-soft); margin: 0; }
.meter { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--mist); text-align: left; }
.bar { height: 10px; border-radius: 5px; background: #ECE8F3; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--coral); border-radius: 5px; }
textarea.practice { width: 100%; height: 72px; resize: none; border-radius: 14px; border: 2px solid var(--line); padding: 10px; font-weight: 600; font-size: 15px; outline: none; -webkit-user-select: text; user-select: text; }
textarea.practice.ok { border-color: var(--mint); }
.spacer { flex: 1; }

/* Gallery (browser preview only) */
.frame { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(23,20,42,.15); position: relative; }
.frame.clear { background: #DDE6F3; }
.gal { display: flex; flex-wrap: wrap; gap: 28px; padding: 28px; align-items: flex-start; }
.gal h3 { font: 700 12px var(--text); color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
// ---------- Bridge with the Rust side ----------
const params = new URLSearchParams(location.hash.slice(1));
const pip = {
  view: window.PIP_VIEW || params.get("view") || (params.has("gallery") ? "gallery" : "panel"),
  state: {},
  strings: {},
  send(cmd, args) {
    const msg = JSON.stringify(Object.assign({ cmd }, args || {}));
    if (window.ipc) window.ipc.postMessage(msg); else console.log("ipc →", msg);
  },
  update(patch) { Object.assign(pip.state, patch); if (patch.strings) pip.strings = patch.strings; render(); },
};
window.pip = pip;

/** The translation of an English string, with each %@ replaced in order. */
function t(key, ...args) {
  let s = pip.strings[key] || key;
  for (const a of args) s = s.replace("%@", a);
  return s;
}

// ---------- Tiny DOM helper: strings become text nodes, never HTML ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "svg") el.innerHTML = v;            // only for Pip's drawings, built from constants below
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
const btn = (label, onclick, cls = "btn") => h("button", { class: cls, onclick, type: "button" }, label);
const sw = (on, onchange, label) => h("button", { class: "switch", role: "switch", "aria-checked": String(!!on), "aria-label": label, type: "button", onclick: () => onchange(!on) });

// ---------- Pip, same curves and moods as the macOS app (macos/Sources/Theme.swift) ----------
const BODY = "M100 52 C150 52 172 84 172 118 C172 152 142 170 100 170 C58 170 28 152 28 118 C28 84 50 52 100 52 Z";
function pipSVG(mood, mini, size) {
  const ink = "#17142A", k = mini ? 1.25 : 1, sw2 = w => w * (mini ? 1.4 : 1);
  const eyes = (y, dx, rx, ry, shine) =>
    `<ellipse cx="${80 + dx}" cy="${y}" rx="${rx * k}" ry="${ry * k}" fill="${ink}"/><ellipse cx="${120 + dx}" cy="${y}" rx="${rx * k}" ry="${ry * k}" fill="${ink}"/>` +
    (!mini && shine ? `<circle cx="${83.5 + dx}" cy="${y - 6}" r="${shine}" fill="#fff"/><circle cx="${123.5 + dx}" cy="${y - 6}" r="${shine}" fill="#fff"/>` : "");
  const line = (d, w) => `<path d="${d}" fill="none" stroke="${ink}" stroke-width="${sw2(w)}" stroke-linecap="round"/>`;
  const faces = {
    ready: eyes(112, 0, 8, 12, 3) + line("M92 134 Q100 141 108 134", 5),
    listening: eyes(mini ? 108 : 110, 0, 9.5, 14, 3.6) + `<ellipse cx="100" cy="${mini ? 140 : 137}" rx="${5 * k}" ry="${4.5 * k}" fill="${ink}"/>`,
    thinking: eyes(100, 6, 8, 12, 0) + line("M93 139 L109 139", 5),
    happy: line("M68 112 Q80 99 92 112", 6.5) + line("M108 112 Q120 99 132 112", 6.5) + line("M86 130 Q100 146 114 130", 5.5),
    oops: line("M64 96 L90 88", 5) + line("M136 96 L110 88", 5) + eyes(114, 0, 8, 11, 0) + line("M88 142 Q94 136 100 142 Q106 148 112 142", 4.5),
    needsYou: eyes(104, 6, 8, 12, 2.6) + `<ellipse cx="104" cy="140" rx="4.5" ry="4" fill="${ink}"/>`,
    resting: line("M70 112 L90 112", 6.5) + line("M110 112 L130 112", 6.5),
  };
  const body = mini ? `<path d="${BODY}" fill="#FF7A5C" opacity="${mood === "resting" ? .75 : 1}"/>`
    : `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA184"/><stop offset="1" stop-color="#FF6A4D"/></linearGradient></defs>` +
      `<path d="${BODY}" fill="url(#g)"/><ellipse cx="72" cy="80" rx="18" ry="9" fill="#fff" opacity=".4" transform="rotate(-20 72 80)"/>` +
      `<ellipse cx="62" cy="130" rx="9" ry="5" fill="#E8365D" opacity=".3"/><ellipse cx="138" cy="130" rx="9" ry="5" fill="#E8365D" opacity=".3"/>`;
  const tilt = mood === "needsYou" ? ` transform="rotate(-10 100 165)"` : "";
  return `<svg viewBox="20 40 160 145" width="${size}" height="${Math.round(size * 145 / 160)}" role="img" aria-label="Pip"><g${tilt}>${body}${faces[mood] || faces.ready}</g></svg>`;
}
const pipEl = (mood, mini, size, cls) => h("span", { svg: pipSVG(mood, mini, size), class: cls || "", style: "display:inline-flex" });

// ---------- Shared bits ----------
function keysFor(trigger) { return trigger === "RightCtrl" ? [t("Right Ctrl")] : ["Ctrl", "Win"]; }
function shortcutName(trigger) { return trigger === "RightCtrl" ? t("Right Ctrl") : "Ctrl + Win"; }
function words(n) { return n === 1 ? t("1 word") : t("%@ words", String(n)); }
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000, lang = pip.state.locale || "en";
  if (s < 60) return t("just now");
  try {
    const f = new Intl.RelativeTimeFormat(lang, { numeric: "always", style: "short" });
    if (s < 3600) return f.format(-Math.round(s / 60), "minute");
    if (s < 86400) return f.format(-Math.round(s / 3600), "hour");
    if (s < 86400 * 7) return f.format(-Math.round(s / 86400), "day");
    return new Date(iso).toLocaleDateString(lang, { dateStyle: "medium" });
  } catch { return new Date(iso).toLocaleDateString(); }
}
function selectEl(id, options, value, onchange, label) {
  const s = h("select", { id, "aria-label": label, onchange: e => onchange(e.target.value) }, options.map(([v, n]) => h("option", { value: v }, n)));
  s.value = value;
  return s;
}
function uiLanguages() {
  return [["system", t("Same as the system")], ["en", "English"], ["fr", "Français"], ["de", "Deutsch"], ["it", "Italiano"], ["es", "Español"], ["pt", "Português"]];
}
function dictationLanguages(short) {
  return [["auto", short ? t("Automatic") : t("Automatic (detect language)")], ["fr", "Français"], ["en", "English"], ["it", "Italiano"], ["de", "Deutsch"], ["es", "Español"], ["pt", "Português"]];
}

// ---------- Pill ----------
let pillStart = 0;
function viewPill(s) {
  const p = s.pill;
  if (!p) return h("div", { id: "pill-wrap" });
  const live = p.kind === "listening" || p.kind === "handsFree";
  const mood = { listening: "listening", handsFree: "listening", thinking: "thinking", typed: "happy", info: "happy", copied: "ready", oops: "oops", needsYou: "needsYou", cancelled: "resting" }[p.kind];
  const small = p.kind === "cancelled";
  const kids = [pipEl(mood, true, small ? 36 : 44, live ? "lean" : "")];
  if (live) {
    const levels = (s.levels || []).slice(-10);
    kids.push(h("div", { class: "wave" }, levels.map(l => h("span", { style: `height:${6 + 22 * Math.min(1, Math.max(0, l))}px` }))));
    kids.push(h("span", { class: "t" }, p.kind === "handsFree" ? t("Hands-free") : t("Listening")));
    kids.push(h("span", { class: "grow" }));
    if (p.kind === "handsFree") kids.push(h("span", { class: "sub" }, "🔒 " + t("%@ to finish", shortcutName(s.trigger))));
    else { const e = pillStart ? Math.max(0, Math.floor((Date.now() - pillStart) / 1000)) : 0; kids.push(h("span", { class: "sub" }, `${Math.floor(e / 60)}:${String(e % 60).padStart(2, "0")}`)); }
  } else if (p.kind === "thinking") {
    kids.push(h("span", { class: "t" }, t("Writing it down")), h("span", { class: "dots" }, h("span"), h("span"), h("span")));
  } else if (p.kind === "typed") {
    kids.push(h("span", { style: "color:var(--mint);font-weight:900" }, "✓"), h("span", { class: "t ellipsis", style: "max-width:220px" }, p.app ? t("Typed in %@", p.app) : t("Typed")), h("span", { class: "sub" }, words(p.words || 0)));
  } else if (p.kind === "copied") {
    kids.push(h("span", { class: "t" }, t("Copied")), h("span", { class: "sub" }, t("Ctrl+V to paste")));
  } else if (p.kind === "needsYou") {
    kids.push(h("span", { class: "t" }, p.message || ""), btn(t("Set up"), () => pip.send("setup"), "btn amber"));
  } else if (p.kind === "cancelled") {
    kids.push(h("span", { class: "t", style: "font-size:14px;opacity:.85" }, t("Cancelled")));
  } else {
    kids.push(h("span", { class: "t" }, p.message || ""));
  }
  return h("div", { id: "pill-wrap" }, h("div", { class: "pill" + (small ? " small" : "") + (p.kind === "needsYou" ? " amber" : "") }, kids));
}

// ---------- Panel ----------
function statusLine(s) {
  if (!s.hasWhisper) return [t("whisper.cpp isn't installed"), "#E0A100"];
  if (!s.hasModel) return [t("The voice model is missing"), "#E0A100"];
  if (s.mode === "holding" || s.mode === "handsFree") return [t("Listening…"), "#2FBF8C"];
  if (s.mode === "working") return [t("Writing it down…"), "#2FBF8C"];
  return s.whisperReady ? [t("Ready · Whisper runs on this PC"), "#2FBF8C"] : [t("Whisper is loading…"), "#FFC845"];
}
function viewPanel(s) {
  const st = s.settings || {}, [status, color] = statusLine(s), need = !s.hasWhisper || !s.hasModel;
  const mood = s.mode === "working" ? "thinking" : (s.mode === "idle" || !s.mode) ? (need ? "needsYou" : "ready") : "listening";
  const recent = (s.history || []).slice(0, 3);
  return h("div", { id: "panel" },
    h("div", { class: "row" }, pipEl(mood, false, 44),
      h("div", { class: "col grow" }, h("h2", { style: "font-size:18px" }, "Pip Dictée"),
        h("div", { class: "row", style: "gap:6px;font-size:12.5px;font-weight:700" }, h("span", { class: "dot", style: `background:${color}` }), h("span", { class: "soft" }, status))),
      h("button", { class: "icon-btn", type: "button", title: t("Quit Pip Dictée"), "aria-label": t("Quit Pip Dictée"), onclick: () => pip.send("quit") }, "⏻")),
    need ? h("div", { class: "row", style: "padding:12px;border-radius:14px;background:#FFF8E1;border:1px solid rgba(255,200,69,.6)" },
      h("span", { class: "grow", style: "font-weight:700;font-size:13.5px;color:var(--sun-text)" }, s.hasWhisper ? t("Download the voice model") : t("Install whisper.cpp")),
      btn(t("Set up…"), () => pip.send("setup"), "btn amber")) : null,
    h("div", { class: "shortcut" },
      h("div", { class: "row", style: "gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap" }, t("Hold"), keysFor(st.trigger).map(k => h("span", { class: "key" }, k)), t("and talk")),
      h("div", { class: "soft", style: "font-size:12.5px" }, t("Add Space for hands-free · Esc cancels")),
      h("button", { class: "btn fill", type: "button", disabled: s.mode === "working", onclick: () => pip.send("toggle") },

  if (pip.view === "pill" && !(pip.state.pill && (pip.state.pill.kind === "listening" || pip.state.pill.kind === "handsFree"))) pillStart = 0;
